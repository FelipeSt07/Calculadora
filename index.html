<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Profesional</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="calculator-container">
        <div class="mode-toggle">
            <button class="bt" id="basic-mode">Calculadora Básica</button>
            <button class="bt" id="scientific-mode">Calculadora Científica</button>
        </div>

        <div class="calculator basic">
            <div class="display">
                <input type="text" id="result" disabled>
            </div>
            <div class="buttons">
                <button class="operator" onclick="clearDisplay()">C</button>
                <button class="operator" onclick="appendValue('%')">%</button>
                <button class="operator" onclick="deleteLast()">⌫</button>
                <button class="operator" onclick="appendValue('/')">÷</button>

                <button onclick="appendValue('7')">7</button>
                <button onclick="appendValue('8')">8</button>
                <button onclick="appendValue('9')">9</button>
                <button class="operator" onclick="appendValue('*')">×</button>

                <button onclick="appendValue('4')">4</button>
                <button onclick="appendValue('5')">5</button>
                <button onclick="appendValue('6')">6</button>
                <button class="operator" onclick="appendValue('-')">−</button>

                <button onclick="appendValue('1')">1</button>
                <button onclick="appendValue('2')">2</button>
                <button onclick="appendValue('3')">3</button>
                <button class="operator" onclick="appendValue('+')">+</button>

                <button onclick="appendValue('0')">0</button>
                <button onclick="appendValue('.')">.</button>
                <button class="equal" onclick="calculateResult()">=</button>
            </div>
        </div>

        <div class="calculator scientific hidden">
            <div class="display">
                <input type="text" id="result-scientific" disabled>
            </div>
            <div class="buttons">
                <button class="operator" onclick="clearDisplay()">C</button>
                <button class="operator" onclick="appendValue('%')">%</button>
                <button class="operator" onclick="deleteLast()">⌫</button>
                <button class="operator" onclick="appendValue('/')">÷</button>

                <button onclick="appendValue('7')">7</button>
                <button onclick="appendValue('8')">8</button>
                <button onclick="appendValue('9')">9</button>
                <button class="operator" onclick="appendValue('*')">×</button>

                <button onclick="appendValue('4')">4</button>
                <button onclick="appendValue('5')">5</button>
                <button onclick="appendValue('6')">6</button>
                <button class="operator" onclick="appendValue('-')">−</button>

                <button onclick="appendValue('1')">1</button>
                <button onclick="appendValue('2')">2</button>
                <button onclick="appendValue('3')">3</button>
                <button class="operator" onclick="appendValue('+')">+</button>

                <button onclick="appendValue('0')">0</button>
                <button onclick="appendValue('.')">.</button>
                <button onclick="appendValue('Math.E')">e</button>
                <button class="equal-ci" onclick="calculateResult()">=</button>

                <!-- Botones científicos -->
                <button onclick="appendValue('Math.sin(')">sin</button>
                <button onclick="appendValue('Math.cos(')">cos</button>
                <button onclick="appendValue('Math.tan(')">tan</button>
                <button onclick="appendValue('Math.log10(')">log</button>

                <button onclick="appendValue('Math.LN10')">ln</button>
                <button onclick="appendValue('Math.sqrt(')">√</button>
                <button onclick="appendValue('Math.pow(')">xʸ</button>
                <button onclick="appendValue('Math.PI')">π</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
